name: advanced-paper-scan

on:
  schedule:
    - cron: '45 */4 * * *'
  workflow_dispatch:

concurrency:
  group: advanced-paper
  cancel-in-progress: true

jobs:
  advanced-paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ENABLE_ADVANCED_PAPER: '1'
      ENABLE_ADVANCED_TELEGRAM: '1'
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        run: python3 run_regression_tests.py

      - name: Run advanced validation
        run: python3 advanced_validation.py --days 90

      - name: Run validation-gated advanced scanner
        run: python3 advanced_scan.py

      - name: Commit reports and paper candidates
        run: |
          git config user.name "propbot[bot]"
          git config user.email "propbot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "advanced scan $(date -u +%FT%TZ)"
          git push || echo "push failed (non-fatal)"
