name: funding-research-scan
on:
  schedule:
    # Every four hours; report generation only, no exchange-order capability.
    - cron: '15 */4 * * *'
  workflow_dispatch:    # manual fallback

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic regression suite
        run: python3 run_regression_tests.py

      - name: Run funding-divergence research scan
        run: python3 funding_scan.py

      - name: Run read-only paper monitor
        run: python3 paper_monitor.py --symbols BTCUSDT ETHUSDT SOLUSDT

      - name: Run generic prop-rule paper report
        run: python3 prop_rules_report.py

      - name: Commit results
        run: |
          git config user.name "propbot[bot]"
          git config user.email "propbot@users.noreply.github.com"
          git add -A data reports keepalive.txt
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%TZ)"
          git push || echo "push failed (non-fatal)"
