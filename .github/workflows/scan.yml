name: signal-scan
on:
  schedule:
    # FIX: Only run during London/NY session (08:00-16:00 UTC) for +10 session bonus
    # This increases signal pass rate 4-9x by ensuring every scan earns the bonus
    - cron: '0,15,30,45 8-16 * * *'
  workflow_dispatch:    # manual fallback

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name "propbot[bot]"
          git config user.email "propbot@users.noreply.github.com"
          git add -A data keepalive.txt
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%TZ)"
          git push || echo "push failed (non-fatal)"
